<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F3EE">
  <title>한신 AI·SW 페스티벌 폰 영상</title>
  <style>
    @font-face {
      font-family: "Pretendard";
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url("fonts/Pretendard-Medium.subset.woff2") format("woff2");
    }
    @font-face {
      font-family: "Pretendard";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("fonts/Pretendard-Bold.subset.woff2") format("woff2");
    }
    @font-face {
      font-family: "Pretendard";
      font-style: normal;
      font-weight: 800;
      font-display: swap;
      src: url("fonts/Pretendard-ExtraBold.subset.woff2") format("woff2");
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      background: #F5F3EE;
      color: #18181B;
      color-scheme: light;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      font-weight: 500;
      letter-spacing: -0.02em;
      word-break: keep-all;
    }
    button, label { -webkit-tap-highlight-color: transparent; }
    main {
      width: min(440px, 100%);
      margin: 0 auto;
      padding: 22px 18px 168px;
    }
    .kicker {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #78716C;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 36px;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.045em;
    }
    .brand { margin: 0 0 14px; }
    .brand span { display: inline-block; }
    .brand b {
      display: block;
      color: #18181B;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.18em;
    }
    .brand i {
      display: block;
      width: calc(100% - 0.18em);
      height: 3px;
      margin-top: 6px;
      background: #B89047;
    }
    .lede {
      margin: 0;
      font-size: 17px;
      line-height: 1.45;
      font-weight: 700;
      color: #18181B;
    }
    .aside {
      margin: 8px 0 0;
      font-size: 14px;
      line-height: 1.5;
      color: #44403C;
    }
    .shelf {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin: 22px 0 0;
      padding: 0;
      border: 0;
      min-width: 0;
    }
    .shelf legend {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
    .shelf label {
      position: relative;
      display: block;
      min-width: 0;
      overflow: hidden;
      border: 3px solid #E7E5E4;
      border-radius: 22px;
      background: #fff;
      color: #18181B;
      cursor: pointer;
    }
    .shelf label.on { border-color: #B89047; }
    .shelf input { position: absolute; opacity: 0; }
    .shelf video {
      display: block;
      width: 100%;
      height: clamp(210px, 36vh, 320px);
      object-fit: cover;
      object-position: center;
      background: #0D1928;
      pointer-events: none;
    }
    .shelf label.pile video { background: #F5F3EE; }
    .shelf span { display: block; padding: 12px 14px 14px; }
    .shelf strong {
      display: block;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .shelf em {
      display: block;
      margin-top: 3px;
      font-style: normal;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      color: #44403C;
    }
    .cap {
      margin: 10px 0 0;
      text-align: center;
      font-size: 12px;
      color: #78716C;
    }
    .who {
      display: block;
      margin: 18px 0 0;
    }
    .who span {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #78716C;
    }
    .who input {
      display: block;
      width: 100%;
      padding: 15px 16px;
      border: 0;
      border-radius: 16px;
      background: #fff;
      color: #18181B;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
    }
    .who input::placeholder { color: #A8A29E; font-weight: 500; }
    .dock {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(440px, 100%);
      z-index: 2;
      margin: 0;
      padding: 12px 18px calc(14px + env(safe-area-inset-bottom));
      background: #F5F3EE;
      border-top: 1px solid #E7E5E4;
    }
    .dock:has(#handoff:not([hidden])) {
      position: static;
      left: auto;
      bottom: auto;
      transform: none;
      width: auto;
      margin: 18px -18px 0;
    }
    .pick {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      border: 1.5px solid #18181B;
      border-radius: 999px;
      background: #fff;
      color: #18181B;
      text-align: center;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.03em;
      cursor: pointer;
    }
    button.primary, a.primary {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 16px 18px;
      border: 0;
      border-radius: 999px;
      background: #18181B;
      color: #fff;
      text-align: center;
      text-decoration: none;
      font: inherit;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.03em;
      cursor: pointer;
    }
    button.primary:disabled { opacity: 0.45; }
    #photos {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    #picked {
      margin: 8px 0 0;
      min-height: 0;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: #44403C;
    }
    #picked:empty { margin: 0; }
    #reel {
      width: min(260px, 78%);
      display: block;
      margin: 16px auto 0;
      border-radius: 20px;
      background: #0D1928;
    }
    #handoff[hidden] { display: none; }
    a.quiet {
      display: block;
      margin-top: 10px;
      color: #44403C;
      text-align: center;
      text-decoration: underline;
      font-size: 14px;
      font-weight: 700;
    }
    #status {
      margin: 10px 0 0;
      text-align: center;
      font-size: 14px;
      line-height: 1.45;
      color: #44403C;
    }
    #status:empty { margin: 0; }
    .fine {
      margin: 16px 2px 0;
      font-size: 13px;
      line-height: 1.5;
      color: #78716C;
    }
    #stage {
      position: fixed;
      left: -4000px;
      top: 0;
      width: 720px;
      height: 1280px;
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">2026 한신 AI·SW 페스티벌</p>
    <h1>같이 온 사람에게</h1>
    <p class="brand"><span><b>MBOX</b><i></i></span></p>
    <p class="lede">이 폰이 파일을 만듭니다. 부스 와이파이에는 들어오지 않아도 됩니다.</p>
    <p class="aside">사진은 이 폰 안에만 있습니다. 소리 없는 세로 영상이고, 부스로 보내지 않습니다. 로그인과 결제는 없습니다. 주문 앨범이 아닙니다.</p>
    <fieldset class="shelf">
      <legend>모습</legend>
      <label class="on">
        <input type="radio" name="look" value="cards" checked>
        <span><strong>세운 카드</strong><em>앞 카드가 옆으로 물러나고, 다음 인물이 들어옵니다.</em></span>
        <video muted loop playsinline autoplay preload="auto" src="template-previews/stand-faces.mp4?v=20261027c"></video>
      </label>
      <label class="pile">
        <input type="radio" name="look" value="pile">
        <span><strong>포개기</strong><em>다음 인화가 위에서 내려와 겹칩니다.</em></span>
        <video muted loop playsinline autoplay preload="auto" src="template-previews/pile-faces.mp4?v=20261027c"></video>
      </label>
    </fieldset>
    <p class="cap">예시 영상 · 손님 사진 아님</p>
    <label class="who"><span>이름</span>
      <input id="forName" maxlength="16" placeholder="이름. 비워 두면 같이 온 사람" autocomplete="off">
    </label>
    <div class="dock">
      <label class="pick" for="photos">사진 고르기</label>
      <input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple>
      <p id="picked"></p>
      <button id="make" class="primary" type="button">영상 만들기</button>
      <p id="status" role="status"></p>
      <div id="handoff" hidden>
        <video id="reel" controls playsinline></video>
        <button id="send" class="primary" type="button">이 사람에게 보내기</button>
        <a id="keep" class="quiet">이 폰에 저장</a>
      </div>
    </div>
    <p class="fine">곰은 부스 홀로그램에 있습니다. 이 페이지로는 곰이 움직이지 않습니다. 노래는 들어 있지 않습니다. 만든 파일은 이 폰에 남습니다.</p>
  </main>
  <canvas id="stage" width="720" height="1280"></canvas>
  <script>
    var W = 720;
    var H = 1280;
    var END = 1.6;
    var FACE_W = 768;
    var FACE_H = 1024;
    var STAND = {
      lead: 0.35,
      travel: 1.05,
      rest: 0.9,
      homeX: 110,
      homeY: 280,
      w: 500,
      h: 700,
      asideX: 240,
      asideY: 16,
      enterX: 860
    };
    var PILE = {
      lead: 0.35,
      fall: 1.25,
      settle: 0.38,
      rest: 0.72,
      w: 520,
      h: 660,
      margin: 28,
      baseX: 360,
      baseY: 700,
      stack: 92,
      overshoot: 20
    };
    var PILE_ANGLES = [-0.15, 0.13, -0.09, 0.15, -0.07, 0.1];
    var PILE_XOFF = [-18, 34, -26, 16, -12, 22];

    function standSlot() { return STAND.travel + STAND.rest; }
    function pileSlot() { return PILE.fall + PILE.settle + PILE.rest; }

    function smooth(p) {
      var u = Math.max(0, Math.min(1, p));
      return u * u * (3 - 2 * u);
    }

    function bodySeconds(n, look) {
      var count = Math.max(0, n | 0);
      if (count <= 1) return 3;
      if (look === "pile") return PILE.lead + (count - 1) * pileSlot() + 0.2;
      return STAND.lead + (count - 1) * standSlot() + 0.15;
    }

    function arrival(index, t, lead, travel, slot) {
      if (index <= 0) return 1;
      var start = lead + (index - 1) * slot;
      if (t < start) return -1;
      if (t >= start + travel) return 1;
      return smooth((t - start) / travel);
    }

    function standCards(n, t) {
      var slot = standSlot();
      var cards = [];
      var i;
      var k;
      for (i = 0; i < n; i += 1) {
        var enter = arrival(i, t, STAND.lead, STAND.travel, slot);
        if (enter < 0) continue;
        var push = 0;
        for (k = i + 1; k < n; k += 1) {
          var later = arrival(k, t, STAND.lead, STAND.travel, slot);
          if (later < 0) break;
          push += later;
        }
        cards.push({
          i: i,
          x: STAND.enterX + (STAND.homeX - STAND.enterX) * enter - push * STAND.asideX,
          y: STAND.homeY + (1 - enter) * 36 + push * STAND.asideY,
          w: STAND.w,
          h: STAND.h,
          enter: enter
        });
      }
      return cards;
    }

    function pileCards(n, t) {
      var slot = pileSlot();
      var items = [];
      var i;
      for (i = 0; i < n; i += 1) {
        var restX = PILE.baseX + PILE_XOFF[i % PILE_XOFF.length];
        var restY = PILE.baseY - i * PILE.stack;
        var ang = PILE_ANGLES[i % PILE_ANGLES.length];
        var x = restX;
        var y = restY;
        var rot = ang;
        if (i > 0) {
          var start = PILE.lead + (i - 1) * slot;
          if (t < start) continue;
          var local = t - start;
          if (local < PILE.fall) {
            var p = smooth(local / PILE.fall);
            var y0 = -PILE.h * 0.55;
            var y1 = restY + PILE.overshoot;
            y = y0 + (y1 - y0) * p;
            x = (restX + 64) + (restX - restX - 64) * p;
            rot = -0.46 + (ang + 0.46) * p;
          } else if (local < PILE.fall + PILE.settle) {
            var s = smooth((local - PILE.fall) / PILE.settle);
            y = (restY + PILE.overshoot) + (restY - restY - PILE.overshoot) * s;
            rot = ang;
          }
        }
        items.push({ i: i, x: x, y: y, rot: rot, w: PILE.w, h: PILE.h });
      }
      return items;
    }

    function audit() {
      var fail = [];
      function check(cond, msg) { if (!cond) fail.push(msg); }
      var a = standCards(2, 0.2);
      var b = standCards(2, 1.0);
      var c = standCards(2, 2.0);
      check(a.length === 1 && a[0].i === 0, "0.2초에 카드가 하나가 아님");
      check(b.length === 2, "1.0초에 두 번째 카드가 없음");
      var b0 = b[0];
      var b1 = b[1];
      check(b1.x < W - 80, "1.0초에 새 카드가 화면 밖에 있음");
      check(a[0].x - b0.x > 120, "1.0초에 앞 카드가 거의 안 비킴");
      check(Math.abs(c[1].x - STAND.homeX) < 0.01 && c[1].i === 1, "2.0초에 새 카드가 앞에 없음");
      check(a[0].x - c[0].x > 180, "2.0초에 앞 카드가 10px만 비킴");
      var h1 = standCards(2, 1.7);
      var h2 = standCards(2, 2.3);
      check(h1[0].x === h2[0].x && h1[1].x === h2[1].x && h1[0].y === h2[0].y, "세운 카드가 도착 뒤에 흔들림");
      var p0 = pileCards(2, 0.2);
      var p1 = pileCards(2, 1.0);
      var p2 = pileCards(2, 2.0);
      check(p0.length === 1, "0.2초에 인화가 하나가 아님");
      check(p1.length === 2 && p1[1].y < p0[0].y - 180, "1.0초에 새 인화가 위에서 오지 않음");
      check(p2[1].y < p2[0].y - 50, "2.0초에 더미가 높아지지 않음");
      check(p2[1].y > p1[1].y + 250, "새 인화가 내려앉지 않음");
      check(Math.abs(p2[1].y - (PILE.baseY - PILE.stack)) < 0.01, "2.0초에 안착이 끝나지 않음");
      var q1 = pileCards(2, 2.1);
      var q2 = pileCards(2, 2.5);
      check(q1[1].y === q2[1].y && q1[1].rot === q2[1].rot && q1[0].rot === q2[0].rot, "포개기가 안착 뒤에 흔들림");
      check(bodySeconds(6, "cards") + END < 20, "세운 카드 6장이 20초를 넘음");
      check(bodySeconds(6, "pile") + END < 20, "포개기 6장이 20초를 넘음");
      check(standCards(1, 1.2)[0].x === standCards(1, 2.4)[0].x, "사진 한 장이 흔들림");
      var r;
      for (r = 0; r < 30; r += 1) {
        var rt = Math.random() * 0.3;
        if (standCards(6, rt).length !== 1) fail.push("세운 카드가 너무 일찍 등장 " + rt);
        if (pileCards(6, rt).length !== 1) fail.push("인화가 너무 일찍 등장 " + rt);
      }
      return {
        ok: fail.length === 0,
        fail: fail,
        cards6: bodySeconds(6, "cards") + END,
        pile6: bodySeconds(6, "pile") + END,
        stand02x: a[0].x,
        stand20back: c[0].x,
        stand20front: c[1].x,
        pile02y: p0[0].y,
        pile10y: p1[1].y,
        pile20y: p2[1].y
      };
    }

    function cardLine(raw) {
      var text = String(raw == null ? "" : raw).split(/\s+/).join(" ").trim();
      var kept = [];
      var i;
      for (i = 0; i < text.length; i += 1) {
        var ch = text.charAt(i);
        var code = ch.charCodeAt(0);
        var hangul = code >= 0xAC00 && code <= 0xD7A3;
        var latin = (ch >= "A" && ch <= "Z") || (ch >= "a" && ch <= "z");
        var digit = ch >= "0" && ch <= "9";
        if (ch === " " || hangul || latin || digit) kept.push(ch);
      }
      var name = kept.join("").trim().slice(0, 16);
      if (!name) return "같이 온 사람에게";
      var compact = name.split(" ").join("");
      var allHangul = compact.length > 0;
      for (i = 0; i < compact.length; i += 1) {
        var c = compact.charCodeAt(i);
        if (c < 0xAC00 || c > 0xD7A3) allHangul = false;
      }
      if (allHangul && name.slice(-2) !== "에게") return name + "에게";
      return name;
    }

    function traceRound(c, x, y, w, h, r) {
      var rr = Math.max(0, Math.min(r, w / 2, h / 2));
      c.beginPath();
      c.moveTo(x + rr, y);
      c.arcTo(x + w, y, x + w, y + h, rr);
      c.arcTo(x + w, y + h, x, y + h, rr);
      c.arcTo(x, y + h, x, y, rr);
      c.arcTo(x, y, x + w, y, rr);
      c.closePath();
    }

    function drawCover(ctx, img, x, y, w, h) {
      var scale = Math.max(w / img.width, h / img.height);
      var sw = w / scale;
      var sh = h / scale;
      ctx.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, x, y, w, h);
    }

    function clearShadow(ctx) {
      ctx.shadowColor = "transparent";
      ctx.shadowBlur = 0;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 0;
    }

    function paintCard(ctx, img, x, y, w, h) {
      var thick = 18;
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.beginPath();
      ctx.ellipse(w * 0.5, h + 28, w * 0.36, 18, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#B7AA9C";
      ctx.beginPath();
      ctx.moveTo(w - 10, 18);
      ctx.lineTo(w + thick, 8);
      ctx.lineTo(w + thick, h - 16);
      ctx.lineTo(w - 10, h - 8);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#E6DFD4";
      ctx.beginPath();
      ctx.moveTo(16, 0);
      ctx.lineTo(w - 8, 0);
      ctx.lineTo(w + thick - 8, -12);
      ctx.lineTo(22, -12);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#F7F4EE";
      traceRound(ctx, 0, 0, w, h, 22);
      ctx.fill();
      ctx.save();
      traceRound(ctx, 24, 28, w - 48, h - 56, 8);
      ctx.clip();
      drawCover(ctx, img, 24, 28, w - 48, h - 56);
      ctx.restore();
      ctx.restore();
      clearShadow(ctx);
    }

    function paintPrint(ctx, img, item) {
      var w = item.w;
      var h = item.h;
      var m = PILE.margin;
      ctx.save();
      ctx.translate(item.x, item.y);
      ctx.rotate(item.rot);
      ctx.shadowColor = "rgba(24,24,27,0.28)";
      ctx.shadowBlur = 22;
      ctx.shadowOffsetY = 12;
      ctx.fillStyle = "#FFFFFF";
      traceRound(ctx, -w / 2, -h / 2, w, h, 10);
      ctx.fill();
      clearShadow(ctx);
      ctx.save();
      traceRound(ctx, -w / 2 + m, -h / 2 + m, w - m * 2, h - m * 2, 3);
      ctx.clip();
      drawCover(ctx, img, -w / 2 + m, -h / 2 + m, w - m * 2, h - m * 2);
      ctx.restore();
      ctx.restore();
      clearShadow(ctx);
    }

    function drawStand(ctx, images, t) {
      ctx.fillStyle = "#0D1928";
      ctx.fillRect(0, 0, W, H);
      var cards = standCards(images.length, t);
      var i;
      for (i = 0; i < cards.length; i += 1) {
        var card = cards[i];
        if (card.x >= W || card.x + card.w <= -40) continue;
        paintCard(ctx, images[card.i], card.x, card.y, card.w, card.h);
      }
    }

    function drawPile(ctx, images, t) {
      ctx.fillStyle = "#F5F3EE";
      ctx.fillRect(0, 0, W, H);
      var items = pileCards(images.length, t);
      var i;
      for (i = 0; i < items.length; i += 1) paintPrint(ctx, images[items[i].i], items[i]);
    }

    function drawEnd(ctx, who) {
      ctx.fillStyle = "#0D1928";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      ctx.fillStyle = "#FFFFFF";
      ctx.font = '800 68px Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
      var brand = "MBOX";
      var top = 520;
      ctx.fillText(brand, W / 2, top);
      var bw = ctx.measureText(brand).width;
      ctx.fillStyle = "#B89047";
      ctx.fillRect((W - bw) / 2, top + 92, bw, 6);
      ctx.fillStyle = "#E8C26D";
      ctx.font = '700 36px Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
      ctx.fillText(who, W / 2, top + 124);
      ctx.fillStyle = "#D6D3D1";
      ctx.font = '500 22px Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
      ctx.fillText("부스에서 만든 짧은 영상", W / 2, top + 188);
    }

    function drawAt(ctx, images, look, who, t) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
      clearShadow(ctx);
      var body = bodySeconds(images.length, look);
      if (who && t >= body) {
        drawEnd(ctx, who);
        return;
      }
      var time = t;
      if (!who && t > body) time = body;
      if (look === "pile") drawPile(ctx, images, time);
      else drawStand(ctx, images, time);
    }

    function skinScore(data, cols, x0, y0, w, h) {
      var s = 0;
      var n = 0;
      var y;
      var x;
      var y1 = y0 + h;
      var x1 = x0 + w;
      for (y = y0; y < y1; y += 2) {
        for (x = x0; x < x1; x += 2) {
          var i = (y * cols + x) * 4;
          var r = data[i];
          var g = data[i + 1];
          var b = data[i + 2];
          var cb = 128 - 0.168736 * r - 0.331264 * g + 0.5 * b;
          var cr = 128 + 0.5 * r - 0.418688 * g - 0.081312 * b;
          if (cr >= 133 && cr <= 173 && cb >= 77 && cb <= 127 && r > 45 && g > 25 && b > 15) s += 1;
          n += 1;
        }
      }
      return n ? s / n : 0;
    }

    function focusRect(img) {
      var iw = img.width;
      var ih = img.height;
      var aspect = FACE_W / FACE_H;
      var sw;
      var sh;
      if (iw / ih > aspect) {
        sh = ih;
        sw = Math.min(iw, sh * aspect);
      } else {
        sw = iw;
        sh = Math.min(ih, sw / aspect);
      }
      var cols = 72;
      var rows = Math.max(8, Math.round(cols * ih / iw));
      var sample = document.createElement("canvas");
      sample.width = cols;
      sample.height = rows;
      var g = sample.getContext("2d", { willReadFrequently: true });
      g.drawImage(img, 0, 0, cols, rows);
      var data = g.getImageData(0, 0, cols, rows).data;
      var winW = Math.max(4, Math.min(cols, Math.round(sw / iw * cols)));
      var winH = Math.max(4, Math.min(rows, Math.round(sh / ih * rows)));
      var best = -1;
      var bx = 0;
      var by = 0;
      var stepX = Math.max(1, Math.round(winW / 8));
      var stepY = Math.max(1, Math.round(winH / 8));
      var y;
      var x;
      for (y = 0; y + winH <= rows; y += stepY) {
        for (x = 0; x + winW <= cols; x += stepX) {
          var score = skinScore(data, cols, x, y, winW, winH);
          var cx = (x + winW / 2) / cols - 0.5;
          var cy = (y + winH / 2) / rows - 0.4;
          score -= cx * cx * 0.18 + cy * cy * 0.08;
          if (score > best) {
            best = score;
            bx = x;
            by = y;
          }
        }
      }
      var cx0 = Math.max(0, Math.round((cols - winW) / 2));
      var cy0 = Math.max(0, Math.round((rows - winH) * 0.3));
      var center = skinScore(data, cols, cx0, cy0, winW, winH);
      if (!(best > 0.045 && best > center + 0.025)) {
        return { sx: (iw - sw) / 2, sy: Math.max(0, (ih - sh) * 0.28), sw: sw, sh: sh };
      }
      return {
        sx: Math.max(0, Math.min(iw - sw, bx / cols * iw)),
        sy: Math.max(0, Math.min(ih - sh, by / rows * ih)),
        sw: sw,
        sh: sh
      };
    }

    function rasterPortrait(img) {
      var canvas = document.createElement("canvas");
      canvas.width = FACE_W;
      canvas.height = FACE_H;
      var ctx = canvas.getContext("2d");
      var rect = focusRect(img);
      ctx.drawImage(img, rect.sx, rect.sy, rect.sw, rect.sh, 0, 0, FACE_W, FACE_H);
      return canvas;
    }

    var mboxMotion = {
      audit: audit,
      drawAt: drawAt,
      bodySeconds: bodySeconds,
      standCards: standCards,
      pileCards: pileCards,
      rasterPortrait: rasterPortrait,
      END: END,
      W: W,
      H: H
    };
    window.mboxMotion = mboxMotion;

    if (typeof document !== "undefined") {
      var looks = document.querySelectorAll('input[name="look"]');
      var photos = document.getElementById("photos");
      var forName = document.getElementById("forName");
      var make = document.getElementById("make");
      var note = document.getElementById("status");
      var handoff = document.getElementById("handoff");
      var reel = document.getElementById("reel");
      var send = document.getElementById("send");
      var keep = document.getElementById("keep");
      var stage = document.getElementById("stage");
      var ctx = stage.getContext("2d");
      var made = null;
      var madeUrl = "";
      var busy = false;

      function setStatus(text) { note.textContent = text; }

      function pickedLook() {
        var picked = "cards";
        var i;
        for (i = 0; i < looks.length; i += 1) {
          if (looks[i].checked) picked = looks[i].value;
        }
        return picked;
      }

      function markLook() {
        var i;
        for (i = 0; i < looks.length; i += 1) {
          var pile = looks[i].value === "pile" ? "pile" : "";
          var on = looks[i].checked ? "on" : "";
          looks[i].parentNode.className = (pile + " " + on).trim();
        }
      }

      function mimeType() {
        var types = [
          "video/mp4;codecs=avc1.42E01E",
          "video/mp4",
          "video/webm;codecs=vp8",
          "video/webm"
        ];
        if (typeof MediaRecorder === "undefined" || !stage.captureStream) return "";
        var i;
        for (i = 0; i < types.length; i += 1) {
          if (MediaRecorder.isTypeSupported(types[i])) return types[i];
        }
        return "";
      }

      function loadPhoto(file) {
        var ready = (typeof createImageBitmap === "function")
          ? createImageBitmap(file).catch(function () { return null; })
          : Promise.resolve(null);
        return ready.then(function (bmp) {
          if (bmp) {
            var canvas = rasterPortrait(bmp);
            if (bmp.close) bmp.close();
            return canvas;
          }
          return new Promise(function (resolve, reject) {
            var url = URL.createObjectURL(file);
            var img = new Image();
            img.onload = function () {
              URL.revokeObjectURL(url);
              resolve(rasterPortrait(img));
            };
            img.onerror = function () {
              URL.revokeObjectURL(url);
              reject(new Error("photo"));
            };
            img.src = url;
          });
        });
      }

      function extOf(type) {
        return type.indexOf("mp4") >= 0 ? "mp4" : "webm";
      }

      function finish(blob) {
        if (!blob || blob.size < 1200) {
          busy = false;
          make.disabled = false;
          setStatus("영상을 담지 못했습니다.");
          return;
        }
        if (madeUrl) URL.revokeObjectURL(madeUrl);
        made = blob;
        madeUrl = URL.createObjectURL(blob);
        var ext = extOf(blob.type || "");
        reel.src = madeUrl;
        keep.href = madeUrl;
        keep.setAttribute("download", "mbox-festival." + ext);
        handoff.hidden = false;
        if (handoff.scrollIntoView) handoff.scrollIntoView({ block: "nearest" });
        var play = reel.play();
        if (play && play.catch) play.catch(function () {});
        setStatus("나왔습니다. 옆 사람에게 지금 보내세요.");
        busy = false;
        make.disabled = false;
      }

      function captureClip(images, look, who, done, fail) {
        var mime = mimeType();
        if (!mime) {
          fail("mime");
          return;
        }
        var total = bodySeconds(images.length, look) + END;
        drawAt(ctx, images, look, who, 0);
        var stream = stage.captureStream(30);
        var rec;
        try {
          rec = new MediaRecorder(stream, { mimeType: mime });
        } catch (err) {
          fail("recorder");
          return;
        }
        var chunks = [];
        rec.ondataavailable = function (e) {
          if (e.data && e.data.size) chunks.push(e.data);
        };
        rec.onstop = function () {
          done(new Blob(chunks, { type: rec.mimeType || mime }));
        };
        rec.onerror = function () { fail("error"); };
        var t0 = performance.now();
        rec.start(100);
        function frame(now) {
          var t = (now - t0) / 1000;
          drawAt(ctx, images, look, who, Math.min(t, total));
          if (t < total + 0.12) {
            requestAnimationFrame(frame);
            return;
          }
          if (rec.state === "recording") rec.stop();
        }
        requestAnimationFrame(frame);
      }

      function record(images, look, who) {
        captureClip(images, look, who, finish, function () {
          busy = false;
          make.disabled = false;
          setStatus("이 브라우저에서는 영상을 파일로 담지 못합니다.");
        });
      }

      mboxMotion.paint = function (look, t) {
        drawAt(ctx, window.__faces, look, "", t);
        return stage.toDataURL("image/png");
      };
      mboxMotion.captureSample = function (look, who) {
        return new Promise(function (resolve, reject) {
          captureClip(window.__faces, look, who, function (blob) {
            var reader = new FileReader();
            reader.onload = function () { resolve({ type: blob.type, url: reader.result, size: blob.size }); };
            reader.onerror = function () { reject(new Error("read")); };
            reader.readAsDataURL(blob);
          }, reject);
        });
      };
      mboxMotion.loadFaces = function (dataUrls) {
        return Promise.all(dataUrls.map(function (src) {
          return new Promise(function (resolve, reject) {
            var img = new Image();
            img.onload = function () { resolve(rasterPortrait(img)); };
            img.onerror = function () { reject(new Error("face")); };
            img.src = src;
          });
        })).then(function (faces) {
          window.__faces = faces;
          return faces.length;
        });
      };

      var n;
      for (n = 0; n < looks.length; n += 1) {
        looks[n].addEventListener("change", markLook);
      }
      photos.addEventListener("change", function () {
        var count = (photos.files && photos.files.length) || 0;
        document.getElementById("picked").textContent = count ? ("사진 " + Math.min(count, 6) + "장") : "";
      });
      make.addEventListener("click", function () {
        if (busy) return;
        var files = Array.prototype.slice.call(photos.files || []).slice(0, 6);
        if (!files.length) {
          setStatus("사진을 먼저 고르세요.");
          return;
        }
        busy = true;
        make.disabled = true;
        handoff.hidden = true;
        reel.removeAttribute("src");
        setStatus("이 폰에서 만드는 중입니다.");
        var look = pickedLook();
        var who = cardLine(forName.value);
        var ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
        ready.then(function () {
          return Promise.all(files.map(loadPhoto));
        }).then(function (images) {
          record(images, look, who);
        }).catch(function () {
          busy = false;
          make.disabled = false;
          setStatus("사진을 읽지 못했습니다.");
        });
      });
      send.addEventListener("click", function () {
        if (!made) return;
        var ext = extOf(made.type || "");
        var file = new File([made], "mbox-festival." + ext, { type: made.type || "application/octet-stream" });
        var text = cardLine(forName.value);
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: "MBOX", text: text }).catch(function (err) {
            if (err && err.name === "AbortError") return;
            keep.click();
          });
          return;
        }
        keep.click();
      });
      markLook();
    }
  </script>
</body>
</html>
