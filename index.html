<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F3EE">
  <title>한신 AI·SW 페스티벌 폰 영상</title>
  <style>
    @font-face {
      font-family: "Pretendard";
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url("fonts/Pretendard-Medium.subset.woff2") format("woff2");
    }
    @font-face {
      font-family: "Pretendard";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("fonts/Pretendard-Bold.subset.woff2") format("woff2");
    }
    @font-face {
      font-family: "Pretendard";
      font-style: normal;
      font-weight: 800;
      font-display: swap;
      src: url("fonts/Pretendard-ExtraBold.subset.woff2") format("woff2");
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      background: #F5F3EE;
      color: #18181B;
      color-scheme: light;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      font-weight: 500;
      letter-spacing: -0.02em;
      word-break: keep-all;
    }
    button, label { -webkit-tap-highlight-color: transparent; }
    main {
      width: min(440px, 100%);
      margin: 0 auto;
      padding: 14px 0 36px;
    }
    .pad { padding-left: 16px; padding-right: 16px; }
    .kicker {
      margin: 0 0 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #78716C;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 32px;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.045em;
    }
    .brand { margin: 0 0 10px; }
    .brand span { display: inline-block; }
    .brand b {
      display: block;
      color: #18181B;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.18em;
    }
    .brand i {
      display: block;
      width: calc(100% - 0.18em);
      height: 3px;
      margin-top: 6px;
      background: #B89047;
    }
    .lede {
      margin: 0;
      font-size: 16px;
      line-height: 1.4;
      font-weight: 700;
      color: #18181B;
    }
    .aside {
      margin: 6px 0 0;
      font-size: 14px;
      line-height: 1.45;
      color: #44403C;
    }
    .player {
      position: relative;
      width: 100%;
      margin-top: 14px;
      aspect-ratio: 9 / 19.5;
      background: #000;
      overflow: hidden;
    }
    .player video, .player canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      display: block;
    }
    .shelf {
      display: flex;
      gap: 8px;
      margin: 12px 0 0;
      padding: 0 16px 6px;
      border: 0;
      min-width: 0;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .shelf legend {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
    .shelf label {
      position: relative;
      flex: 0 0 46vw;
      width: 46vw;
      max-width: 210px;
      min-width: 164px;
      scroll-snap-align: start;
      color: #18181B;
      cursor: pointer;
    }
    .shelf input { position: absolute; opacity: 0; }
    .shelf .frame {
      position: relative;
      display: block;
      aspect-ratio: 9 / 19.5;
      overflow: hidden;
      border-radius: 16px;
      background: #000;
    }
    .shelf label.on .frame { box-shadow: inset 0 0 0 3px #B89047; }
    .shelf video, .shelf img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      display: block;
      pointer-events: none;
    }
    .shelf strong {
      display: block;
      margin-top: 8px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .shelf em {
      display: block;
      margin-top: 2px;
      font-style: normal;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.35;
      color: #44403C;
    }
    .cap {
      margin: 12px 0 0;
      text-align: center;
      font-size: 12px;
      color: #78716C;
    }
    .choice {
      margin: 14px 0 0;
      padding: 0;
      border: 0;
      min-width: 0;
    }
    .choice legend {
      padding: 0;
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 700;
      color: #78716C;
    }
    .choice div { display: flex; flex-wrap: wrap; gap: 8px; }
    .choice label {
      position: relative;
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 14px;
      border: 1.5px solid #18181B;
      border-radius: 999px;
      background: #fff;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.03em;
      cursor: pointer;
    }
    .choice input { position: absolute; opacity: 0; }
    .choice label.on { background: #18181B; color: #fff; }
    .who { display: block; margin: 14px 0 0; }
    .who span {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #78716C;
    }
    .who input {
      display: block;
      width: 100%;
      padding: 15px 16px;
      border: 0;
      border-radius: 16px;
      background: #fff;
      color: #18181B;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
    }
    .who input::placeholder { color: #A8A29E; font-weight: 500; }
    .tools { margin-top: 4px; }
    .pick {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      margin-top: 14px;
      border: 1.5px solid #18181B;
      border-radius: 999px;
      background: #fff;
      color: #18181B;
      text-align: center;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.03em;
      cursor: pointer;
    }
    button.primary, a.primary {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 16px 18px;
      border: 0;
      border-radius: 999px;
      background: #18181B;
      color: #fff;
      text-align: center;
      text-decoration: none;
      font: inherit;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.03em;
      cursor: pointer;
    }
    button.primary:disabled { opacity: 0.45; }
    #photos {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    #picked {
      margin: 8px 0 0;
      min-height: 0;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: #44403C;
    }
    #picked:empty { margin: 0; }
    #reel {
      width: 100%;
      aspect-ratio: 9 / 19.5;
      object-fit: cover;
      display: block;
      margin: 14px 0 0;
      background: #000;
    }
    #handoff[hidden] { display: none; }
    a.quiet {
      display: block;
      margin-top: 10px;
      color: #44403C;
      text-align: center;
      text-decoration: underline;
      font-size: 14px;
      font-weight: 700;
    }
    #status {
      margin: 10px 0 0;
      text-align: center;
      font-size: 14px;
      line-height: 1.45;
      color: #44403C;
    }
    #status:empty { margin: 0; }
    .fine {
      margin: 16px 0 0;
      font-size: 13px;
      line-height: 1.5;
      color: #78716C;
    }
  </style>
</head>
<body>
  <main>
    <div class="pad">
      <p class="kicker">2026 한신 AI·SW 페스티벌</p>
      <h1>같이 온 사람에게</h1>
      <p class="brand"><span><b>MBOX</b><i></i></span></p>
      <p class="lede">이 폰이 파일을 만듭니다. 부스 와이파이에는 들어오지 않아도 됩니다.</p>
      <p class="aside">사진은 이 폰 안에만 있습니다. 소리 없는 세로 영상이고, 부스로 보내지 않습니다. 로그인과 결제는 없습니다. 주문 앨범이 아닙니다.</p>
    </div>
    <div id="player" class="player">
      <video id="playerVideo" muted loop playsinline autoplay preload="auto" src="template-previews/cube-faces.mp4?v=20261027h"></video>
      <canvas id="stage" width="720" height="1560"></canvas>
    </div>
    <fieldset class="shelf">
      <legend>모습</legend>
      <label class="on">
        <input type="radio" name="look" value="cube" checked>
        <span class="frame"><img alt="" src="template-previews/cube-poster.jpg?v=20261027h"></span>
        <strong>큐브</strong><em>가까운 큐브가 한 번 돌아 다음 얼굴을 보여 줍니다.</em>
      </label>
      <label>
        <input type="radio" name="look" value="cards">
        <span class="frame"><img alt="" src="template-previews/stand-poster.jpg?v=20261027h"></span>
        <strong>세운 카드</strong><em>두 얼굴이 나란히 선 뒤 새 카드가 앞을 차지합니다.</em>
      </label>
      <label>
        <input type="radio" name="look" value="pile">
        <span class="frame"><img alt="" src="template-previews/pile-poster.jpg?v=20261027h"></span>
        <strong>포개기</strong><em>다음 인화가 위에서 떨어져 겹칩니다.</em>
      </label>
      <label>
        <input type="radio" name="look" value="flip">
        <span class="frame"><img alt="" src="template-previews/flip-poster.jpg?v=20261027h"></span>
        <strong>뒤집기</strong><em>큰 카드가 돌려져 다음 얼굴을 보여 줍니다.</em>
      </label>
      <label>
        <input type="radio" name="look" value="fan">
        <span class="frame"><img alt="" src="template-previews/fan-poster.jpg?v=20261027h"></span>
        <strong>붙여 오르기</strong><em>카드가 올라오며 여러 얼굴이 펼쳐집니다.</em>
      </label>
    </fieldset>
    <p class="cap">예시 영상 · 손님 사진 아님</p>
    <div class="pad tools">
      <fieldset class="choice">
        <legend>배경</legend>
        <div>
          <label class="on"><input type="radio" name="bg" value="black" checked>검정</label>
          <label><input type="radio" name="bg" value="navy">남색</label>
          <label><input type="radio" name="bg" value="ivory">아이보리</label>
        </div>
      </fieldset>
      <fieldset class="choice">
        <legend>입자</legend>
        <div>
          <label><input type="radio" name="fx" value="off">끄기</label>
          <label class="on"><input type="radio" name="fx" value="dust" checked>먼지</label>
          <label><input type="radio" name="fx" value="lights">불빛</label>
        </div>
      </fieldset>
      <label class="who"><span>이름</span>
        <input id="forName" maxlength="16" placeholder="이름. 비워 두면 같이 온 사람" autocomplete="off">
      </label>
      <label class="pick" for="photos">사진 고르기</label>
      <input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple>
      <p id="picked"></p>
      <button id="make" class="primary" type="button">영상 만들기</button>
      <p id="status" role="status"></p>
      <div id="handoff" hidden>
        <video id="reel" controls playsinline></video>
        <button id="send" class="primary" type="button">이 사람에게 보내기</button>
        <a id="keep" class="quiet">이 폰에 저장</a>
      </div>
      <p class="fine">곰은 부스 홀로그램에 있습니다. 이 페이지로는 곰이 움직이지 않습니다. 노래는 들어 있지 않습니다. 만든 파일은 이 폰에 남습니다.</p>
    </div>
  </main>
  <script>
    var W = 720;
    var H = 1560;
    var END = 1.6;
    var PREVIEW = 2.5;
    var STAND = { lead: 0.22, travel: 0.32, settle: 0.78, rest: 0.55 };
    var PILE = { lead: 0.22, fall: 1.35, settle: 0.5, rest: 0.25, margin: 32, overshoot: 18 };
    var FLIP = { lead: 0.15, spin: 1.72, rest: 0.45 };
    var FAN = { lead: 0.35, rise: 1.4, hold: 0.45, tuck: 0.4, rest: 0.12 };
    var CUBE = { lead: 0.25, turn: 1.22, hold: 0.55, rest: 0.2, size: 2, fov: 0.8, pad: 1.08, corner: 0.78 };
    var CUBE_Y_SIGN = 1;
    var FACE_FRONT = 1;
    var FACE_SIDE = 2;

    function clamp01(p) { return p < 0 ? 0 : p > 1 ? 1 : p; }
    function smooth(p) { var u = clamp01(p); return u * u * (3 - 2 * u); }
    function easeOutCubic(p) { var u = 1 - clamp01(p); return 1 - u * u * u; }
    function easeInQuad(p) { var u = clamp01(p); return u * u; }
    function easeInOut(p) {
      var u = clamp01(p);
      return u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    }
    function unit(i, salt) {
      var x = Math.sin(i * 12.9898 + salt * 78.233) * 43758.5453;
      return x - Math.floor(x);
    }
    function mixNum(a, b, p) { return a + (b - a) * p; }
    function mixCard(a, b, p) {
      return {
        i: b.i,
        x: mixNum(a.x, b.x, p),
        y: mixNum(a.y, b.y, p),
        w: mixNum(a.w, b.w, p),
        h: mixNum(a.h, b.h, p),
        rot: mixNum(a.rot, b.rot, p),
        rotZ: mixNum(a.rotZ || 0, b.rotZ || 0, p)
      };
    }

    function standSlot() { return STAND.travel + STAND.settle + STAND.rest; }
    function pileSlot() { return PILE.fall + PILE.settle + PILE.rest; }
    function flipSlot() { return FLIP.spin + FLIP.rest; }
    function fanSlot() { return FAN.rise + FAN.hold + FAN.tuck + FAN.rest; }
    function cubeSlot() { return CUBE.turn + CUBE.hold + CUBE.rest; }

    function leadOf(look) {
      if (look === "pile") return PILE.lead;
      if (look === "flip") return FLIP.lead;
      if (look === "fan") return FAN.lead;
      if (look === "cube") return CUBE.lead;
      return STAND.lead;
    }
    function slotOf(look) {
      if (look === "pile") return pileSlot();
      if (look === "flip") return flipSlot();
      if (look === "fan") return fanSlot();
      if (look === "cube") return cubeSlot();
      return standSlot();
    }
    function bodySeconds(n, look) {
      var count = Math.max(0, n | 0);
      if (count <= 1) return 3;
      return leadOf(look) + (count - 1) * slotOf(look) + 0.08;
    }

    function standIdle(i) { return { i: i, x: 148, y: 268, w: 424, h: 900, rot: 0, rotZ: 0 }; }
    function standBack(i) { return { i: i, x: 48, y: 340, w: 250, h: 560, rot: 0.15, rotZ: 0 }; }
    function standFar(i) { return { i: i, x: 430, y: 460, w: 210, h: 460, rot: 0.72, rotZ: 0 }; }
    function standClose(i) { return { i: i, x: 250, y: 300, w: 360, h: 780, rot: 0.34, rotZ: 0 }; }
    function cardInside(card) {
      return card.x >= -2 && card.y >= -2 && card.x + card.w <= W + 2 && card.y + card.h <= H + 2;
    }

    function standLayout(n, t) {
      if (n <= 1) return [standIdle(0)];
      var slot = standSlot();
      var local0 = t - STAND.lead;
      if (local0 < 0) return [standIdle(0)];
      var step = Math.min(n - 2, Math.floor(Math.max(0, local0) / slot));
      var u = local0 - step * slot;
      var oldI = step;
      var newI = step + 1;
      var cards = [];
      if (u < STAND.travel) {
        var back = mixCard(standIdle(oldI), standBack(oldI), easeOutCubic(u / STAND.travel));
        if (cardInside(back)) cards.push(back);
        if (!cards.length) cards.push(standIdle(oldI));
        return cards;
      }
      if (u < STAND.travel + STAND.settle) {
        var p = easeInOut((u - STAND.travel) / STAND.settle);
        cards.push(standBack(oldI));
        var neu = mixCard(standFar(newI), standClose(newI), p);
        if (cardInside(neu)) cards.push(neu);
        return cards;
      }
      var take = 0.5;
      var restStart = STAND.travel + STAND.settle;
      if (u < restStart + take) {
        var p2 = smooth((u - restStart) / take);
        var winner = mixCard(standClose(newI), standIdle(newI), p2);
        if (cardInside(winner)) cards.push(winner);
        if (!cards.length) cards.push(standIdle(newI));
        return cards;
      }
      return [standIdle(newI)];
    }

    function pileRest(i) {
      var side = i % 2 === 0 ? -1 : 1;
      return {
        i: i,
        cx: 360 + side * 18,
        cy: 730 - i * 10,
        w: 430,
        h: 900,
        rot: side * -0.04
      };
    }
    function pileLayout(n, t) {
      var items = [];
      var slot = pileSlot();
      var i;
      var shown = 1;
      if (n > 1) {
        var local0 = t - PILE.lead;
        if (local0 >= 0) shown = Math.min(n, 1 + Math.floor(local0 / slot) + 1);
        if (local0 >= 0 && local0 % slot > slot) shown = n;
      }
      var limit = n <= 1 ? 1 : 1;
      if (n > 1) {
        var started = t < PILE.lead ? 0 : Math.min(n - 1, Math.floor((t - PILE.lead) / slot) + 1);
        limit = started + 1;
      }
      for (i = 0; i < n && i < limit; i += 1) {
        var rest = pileRest(i);
        var item = { i: i, cx: rest.cx, cy: rest.cy, w: rest.w, h: rest.h, rot: rest.rot };
        if (i > 0) {
          var local = t - (PILE.lead + (i - 1) * slot);
          if (local < 0) break;
          if (local < PILE.fall) {
            var p = easeInQuad(local / PILE.fall);
            item.cy = mixNum(-820, rest.cy + PILE.overshoot, p);
            item.cx = mixNum(rest.cx + 36, rest.cx, p);
            item.rot = mixNum(-0.2, rest.rot, p);
            item.pitch = mixNum(0.62, 0.08, p);
          } else if (local < PILE.fall + PILE.settle) {
            var s = easeOutCubic((local - PILE.fall) / PILE.settle);
            item.cy = mixNum(rest.cy + PILE.overshoot, rest.cy, s);
            item.pitch = mixNum(0.08, 0, s);
          } else {
            item.pitch = 0;
          }
        }
        items.push(item);
      }
      return items;
    }

    function flipState(n, t) {
      if (n <= 1) return { front: 0, back: 0, angle: 0 };
      var slot = flipSlot();
      var local = t - FLIP.lead;
      if (local < 0) return { front: 0, back: 1, angle: 0 };
      var step = Math.min(n - 2, Math.floor(local / slot));
      var u = local - step * slot;
      var p = u >= FLIP.spin ? 1 : easeInOut(u / FLIP.spin);
      return { front: step, back: step + 1, angle: p * Math.PI };
    }

    function fanIdle(i) { return { i: i, x: 148, y: 268, w: 424, h: 900, rot: -0.04, rotZ: 0 }; }
    function fanBelow(i) { return { i: i, x: 160, y: H + 40, w: 400, h: 820, rot: 0, rotZ: 0 }; }
    function fanLeft(i) { return { i: i, x: 36, y: 320, w: 230, h: 620, rot: 0.48, rotZ: -0.1 }; }
    function fanMid(i) { return { i: i, x: 210, y: 250, w: 280, h: 780, rot: 0, rotZ: 0 }; }
    function fanRight(i) { return { i: i, x: 450, y: 330, w: 220, h: 600, rot: -0.5, rotZ: 0.12 }; }
    function fanOff(i) { return { i: i, x: -520, y: 200, w: 420, h: 1000, rot: 0.2, rotZ: -0.4 }; }

    function fanLayout(n, t) {
      if (n <= 1) return [fanIdle(0)];
      var slot = fanSlot();
      var local = t - FAN.lead;
      if (local < 0) return [fanIdle(0)];
      var step = Math.min(n - 2, Math.floor(local / slot));
      var u = local - step * slot;
      var rise = 0;
      var tuck = 0;
      if (u < FAN.rise) rise = easeOutCubic(u / FAN.rise);
      else if (u < FAN.rise + FAN.hold) rise = 1;
      else if (u < FAN.rise + FAN.hold + FAN.tuck) {
        rise = 1;
        tuck = smooth((u - FAN.rise - FAN.hold) / FAN.tuck);
      } else {
        return [fanIdle(step + 1)];
      }
      var leftFrom = step === 0 && rise < 1 ? fanIdle(step) : (tuck > 0 && step > 0 ? fanLeft(step) : (step === 0 ? fanIdle(step) : fanIdle(step)));
      if (step > 0) leftFrom = fanIdle(step);
      var left = tuck > 0 ? mixCard(fanLeft(step), fanOff(step), tuck) : mixCard(leftFrom, fanLeft(step), rise);
      var midFrom = fanBelow(step + 1);
      var mid = tuck > 0 ? mixCard(fanMid(step + 1), fanIdle(step + 1), tuck) : mixCard(midFrom, fanMid(step + 1), rise);
      var cards = [left, mid];
      if (step + 2 < n) {
        var right = tuck > 0 ? mixCard(fanRight(step + 2), fanOff(step + 2), tuck) : mixCard(fanBelow(step + 2), fanRight(step + 2), rise);
        cards.push(right);
      }
      return cards;
    }

    function cubeView(n, t) {
      if (n <= 1) return { angle: 0, front: 0, side: 0 };
      var slot = cubeSlot();
      var local = t - CUBE.lead;
      if (local < 0) return { angle: 0, front: 0, side: 1 };

            setStatus("큐브를 불러오지 못했습니다.");
            startPreview();
            return;
          }
          if (look === "cube") ensureCube();
          record(images, look, who);
        }).catch(function () {
          busy = false;
          make.disabled = false;
          setStatus(look === "cube" ? "큐브를 불러오지 못했습니다." : "사진을 읽지 못했습니다.");
          startPreview();
        });
      });
      send.addEventListener("click", function () {
        if (!made) return;
        var ext = extOf(made.type || "");
        var file = new File([made], "mbox-festival." + ext, { type: made.type || "application/octet-stream" });
        var text = cardLine(forName.value);
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: "MBOX", text: text }).catch(function (err) {
            if (err && err.name === "AbortError") return;
            keep.click();
          });
          return;
        }
        keep.click();
      });
      markLook();
      stage.style.visibility = "hidden";
      bootFaces();
    }
  </script>
